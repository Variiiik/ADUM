<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AD Kasutajahaldus" />
  <title>AD Kasutajahaldus</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- Login page -->
  <div id="login-page" style="display:none"></div>

  <!-- Main app shell -->
  <div id="app" class="app" style="display:none">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="content-inner" style="display:flex;align-items:center;justify-content:center;height:100%">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-wrap" id="toasts"></div>

  <!-- Modal / drawer overlay -->
  <div id="overlay"></div>

  <!-- Scripts — order matters -->
  <script src="/js/api.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/users.js"></script>
  <script src="/js/views/userDetail.js"></script>
  <script src="/js/views/groups.js"></script>
  <script src="/js/views/services.js"></script>
  <script src="/js/views/auditLog.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/views/requests.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
